services:
  minio:
    # Версия зафиксирована: в более новых релизах из бесплатной консоли
    # убрали настройку прав доступа, и анонимное чтение бакета не открыть.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tesla-charge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
